name: build

on:
  push:
    paths:
      - flake.nix
      - flake.lock
      - package.nix
      - .github/workflows/build.yml
  pull_request:
    paths:
      - flake.nix
      - flake.lock
      - package.nix
      - .github/workflows/build.yml
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v16
      - run: nix flake check
      - run: nix build .#default -L
